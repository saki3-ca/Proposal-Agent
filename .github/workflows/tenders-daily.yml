name: Tender Finder (daily)

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:30 Bangladesh time
  workflow_dispatch:

# Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, GROQ_API_KEY / GEMINI_API_KEY / CLOUDFLARE_* (for ambiguous items),
#          TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  (or SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, DIGEST_TO)
# Variables: DIGEST_CHANNEL = telegram | email | both | none,  TENDERBOT_CONTACT = your e-mail (sent in the User-Agent)
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-tenders.txt
      - run: pip install -r backend/requirements-tenders.txt
      - name: Scrape, classify, store, send digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_CHANNEL: ${{ vars.DIGEST_CHANNEL || 'telegram' }}
          TENDERBOT_CONTACT: ${{ vars.TENDERBOT_CONTACT }}
        run: python -m backend.tenders.run

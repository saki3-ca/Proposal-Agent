name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

# Secrets (repo Settings > Secrets and variables > Actions): HF_TOKEN (write token)
# Variables: HF_SPACE  e.g. "your-username/proposal-agent"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push a clean snapshot to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" && test -n "$HF_SPACE" || { echo "Set secret HF_TOKEN and variable HF_SPACE"; exit 1; }
          # The Space only needs the app; leave test PDFs / Office files / PRD out of the Space repo.
          mkdir /tmp/space
          git archive HEAD | tar -x -C /tmp/space
          rm -rf /tmp/space/test_data /tmp/space/.github /tmp/space/*"Requirements Document.md" /tmp/space/supabase
          cd /tmp/space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
